<!DOCTYPE html>
<html lang="kaa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A1020">
<title>KARMAN AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pri:#0A6CFF;--pri2:#2E9BFF;--pri3:#004EF8;--navy:#0B1A3A;--green:#22C55E;--red:#F2545B;--amber:#F59E0B;--fs:1}
[data-theme=dark]{--bg0:#050912;--bg:#0A1020;--bg2:#0F1729;--card:#141D33;--card2:#1A2540;--card3:#222F4F;--line:#25334F;--tx:#EEF3FF;--tx2:#97A6C6;--tx3:#5E6E8F;--soft:rgba(10,108,255,.16);--shadow:0 10px 30px rgba(0,0,0,.45)}
[data-theme=light]{--bg0:#E7ECF5;--bg:#F3F6FC;--bg2:#FFFFFF;--card:#FFFFFF;--card2:#EEF3FB;--card3:#E3EAF6;--line:#E1E8F3;--tx:#0B1A3A;--tx2:#5B6B8C;--tx3:#94A3B8;--soft:rgba(10,108,255,.10);--shadow:0 10px 30px rgba(15,35,80,.12)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:calc(15px * var(--fs));background:var(--bg0)}
body{font-family:Manrope,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg0);color:var(--tx);overscroll-behavior:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font-family:inherit}
svg.i{width:1.3em;height:1.3em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}
.scr{padding:0 16px 120px;min-height:100vh;animation:fi .22s ease}
.scr.nopad{padding-bottom:30px}
@keyframes fi{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;height:58px;position:sticky;top:0;background:var(--bg);z-index:6;gap:8px}
.top h1{font-size:1.08rem;font-weight:700;flex:1;text-align:center}
.top.left h1{text-align:left}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--tx);position:relative;flex:none}
.ib:active{background:var(--card)}
.dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}
.card{background:var(--card);border-radius:18px;padding:14px}
.card2{background:var(--card2);border-radius:14px;padding:12px}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.sb{justify-content:space-between}
.f1{flex:1;min-width:0}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}
.muted{color:var(--tx2)}.mut3{color:var(--tx3)}
.sm{font-size:.82rem}.xs{font-size:.72rem}.lg{font-size:1.15rem}.b{font-weight:700}.b8{font-weight:800}
.cg{color:var(--green)}.cr{color:var(--red)}.cp{color:var(--pri2)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px;font-size:.85rem;color:var(--tx2)}
.sec .lk{color:var(--tx2);display:flex;align-items:center;gap:2px;font-size:.8rem}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:15px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-weight:700;font-size:.98rem;box-shadow:0 8px 22px rgba(10,108,255,.32)}
.btn:active{transform:scale(.98)}
.btn.sec2{background:var(--card2);color:var(--tx);box-shadow:none}
.btn.red{background:linear-gradient(135deg,#E9414A,#F2737A);box-shadow:0 8px 22px rgba(242,84,91,.3)}
.btn.ghost{background:transparent;color:var(--pri2);box-shadow:none}
.btn.dis{opacity:.45;pointer-events:none}
.btn.sm2{height:38px;border-radius:11px;font-size:.85rem;width:auto;padding:0 16px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;background:var(--card2);font-size:.75rem;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:20px;background:var(--card);font-size:.83rem;font-weight:600;color:var(--tx2);white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;white-space:nowrap;height:38px;border-radius:11px;font-weight:600;font-size:.86rem;color:var(--tx2);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--card3);color:var(--tx)}
.seg.blue button.on{background:var(--soft);color:var(--pri2);box-shadow:inset 0 0 0 1.5px var(--pri)}
.lbl{font-size:.8rem;color:var(--tx2);margin:14px 2px 7px;display:flex;justify-content:space-between}
.inp{width:100%;height:48px;border-radius:13px;background:var(--card);border:1.5px solid transparent;color:var(--tx);padding:0 14px;font-size:.95rem;outline:none}
.inp:focus{border-color:var(--pri)}
.inp::placeholder{color:var(--tx3)}
textarea.inp{height:90px;padding:12px 14px;resize:none}
.sel{display:flex;align-items:center;justify-content:space-between;width:100%;height:48px;border-radius:13px;background:var(--card);padding:0 14px;font-size:.95rem;text-align:left;gap:8px}
.sw{width:44px;height:26px;border-radius:20px;background:var(--card3);position:relative;flex:none;transition:.2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 5px rgba(0,0,0,.25)}
.sw.on{background:var(--pri)}
.sw.on::after{left:21px}
.li{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--card);width:100%;text-align:left}
.grp{border-radius:16px;overflow:hidden;display:flex;flex-direction:column;gap:1px;background:var(--line)}
.grp .li{border-radius:0}
.li .ic{width:22px;color:var(--tx2);display:grid;place-items:center}
.li .t{flex:1;font-size:.93rem;font-weight:500;min-width:0}
.li .s{font-size:.75rem;color:var(--tx2);margin-top:2px}
.li .ch{color:var(--tx3)}
.badge{font-size:.65rem;font-weight:700;padding:3px 8px;border-radius:10px;background:var(--pri);color:#fff}
.tag{font-size:.72rem;padding:4px 10px;border-radius:10px;background:var(--soft);color:var(--pri2);font-weight:700}
/* nav */
.nav{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(min(480px,100vw) - 24px);height:66px;background:var(--card);border-radius:22px;display:flex;align-items:center;justify-content:space-around;z-index:30;box-shadow:var(--shadow);border:1px solid var(--line)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.66rem;color:var(--tx3);width:62px;font-weight:600}
.nav button.on{color:var(--pri2)}
.nav button.on svg{fill:var(--soft)}
.fab{width:56px!important;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2))!important;color:#fff!important;display:grid!important;place-items:center;box-shadow:0 8px 20px rgba(10,108,255,.45);margin-top:-4px}
.fab svg{width:28px;height:28px;stroke-width:2.4}
/* home */
.hb{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:20px;background:var(--card);font-size:.78rem;font-weight:700}
.logo{width:36px;height:36px;border-radius:12px;background:var(--card);display:grid;place-items:center;overflow:hidden}
.logo img{width:24px}
.bal{font-size:2.15rem;font-weight:800;letter-spacing:-.5px;display:flex;align-items:baseline;gap:6px}
.bal small{font-size:1rem;color:var(--tx2);font-weight:600;display:flex;align-items:center;gap:2px}
.hs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;align-items:stretch}
.hs::-webkit-scrollbar{display:none}
.addb{width:46px;flex:none;border-radius:14px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:grid;place-items:center}
.bc{flex:none;min-width:130px;border-radius:14px;padding:10px 12px;color:#fff;text-align:left;position:relative}
.bc .n{font-size:.78rem;opacity:.9;display:flex;align-items:center;gap:5px}
.bc .a{font-size:.95rem;font-weight:700;margin-top:4px}
.bc .sq{position:absolute;top:8px;right:8px;width:14px;height:14px;border-radius:4px;background:rgba(255,255,255,.35)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.68rem;color:var(--tx2);line-height:1.15;text-align:center}
.qa .q{width:100%;aspect-ratio:1;border-radius:20px;display:grid;place-items:center;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),0 6px 16px rgba(0,0,0,.25)}
.qa .q svg{width:34px;height:34px;stroke-width:1.7}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{background:var(--card);border-radius:16px;padding:12px}
.st .v{font-size:1.15rem;font-weight:800}
.bar{height:6px;border-radius:6px;background:var(--card3);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.txi{display:flex;align-items:center;gap:12px;padding:11px 12px;width:100%;text-align:left}
.cic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:1.25rem;flex:none}
.cic svg{width:20px;height:20px}
.daycap{font-size:.75rem;color:var(--tx2);padding:10px 12px 2px;display:flex;justify-content:space-between}
.news{width:180px;height:72px;border-radius:14px;background:linear-gradient(135deg,#0A6CFF,#38BDF8);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.x0{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;display:grid;place-items:center}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(2,6,16,.6);backdrop-filter:blur(3px);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fo .2s}
@keyframes fo{from{opacity:0}}
.sheet{width:100%;max-width:480px;max-height:92vh;overflow-y:auto;background:var(--bg2);border-radius:24px 24px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));animation:su .26s cubic-bezier(.2,.9,.3,1)}
@keyframes su{from{transform:translateY(100%)}}
.ov.center{align-items:center;padding:20px}
.ov.center .sheet{border-radius:22px;animation:zi .2s}
@keyframes zi{from{transform:scale(.92);opacity:0}}
.sh-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px}
.sh-h h3{font-size:1.02rem;font-weight:700;display:flex;align-items:center;gap:6px}
.xb{width:32px;height:32px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--tx2)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--card3);color:var(--tx);padding:11px 18px;border-radius:14px;font-size:.86rem;font-weight:600;z-index:200;box-shadow:var(--shadow);max-width:90vw;text-align:center;animation:fi .2s}
.colors{display:flex;gap:9px;flex-wrap:wrap;background:var(--card);border-radius:14px;padding:10px}
.colors button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.cat{background:var(--card2);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.66rem;text-align:center;line-height:1.15;min-height:74px;justify-content:center;color:var(--tx)}
.cat.on{box-shadow:inset 0 0 0 2px var(--pri);background:var(--soft)}
.cat .e{font-size:1.4rem;line-height:1}
.cat svg{width:22px;height:22px}
.gh{display:flex;align-items:center;gap:10px}
.gico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:1.1rem;color:#fff;flex:none}
.gico svg{width:19px;height:19px}
.lim{font-size:.68rem;color:var(--tx2);border:1px solid var(--line);border-radius:8px;padding:2px 7px;display:flex;align-items:center;gap:3px}
.emg{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emg button{font-size:1.45rem;aspect-ratio:1;border-radius:10px}
.emg button:active,.emg button.on{background:var(--card2)}
.svc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.svc button{background:var(--card);border-radius:16px;padding:16px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:.74rem;text-align:center;line-height:1.2}
.svc svg{width:28px;height:28px;color:var(--pri2);stroke-width:1.5}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 20px;text-align:center;color:var(--tx2)}
.empty .em{font-size:3.4rem}
.np{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.np button{height:54px;border-radius:14px;background:var(--card);font-size:1.3rem;font-weight:600;display:grid;place-items:center}
.np button:active{background:var(--card3)}
.msg{max-width:84%;padding:10px 14px;border-radius:20px;font-size:.98rem;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-bottom-right-radius:6px;min-width:70px}
.msg.me .tm{justify-content:flex-end;opacity:.75}
.msg.ai{align-self:flex-start;background:transparent;padding:2px 2px;max-width:96%}
.msg.ai .tm{color:var(--tx3);opacity:1;margin-top:8px;gap:10px}
.msg .tm{font-size:.66rem;opacity:.6;margin-top:4px;display:flex;align-items:center;gap:6px}
.dsep{align-self:center;font-size:.74rem;padding:5px 12px;border-radius:14px;background:transparent;border:1px solid var(--line);color:var(--tx2);margin:6px 0}
.cbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100vw);padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:var(--bg);display:flex;gap:8px;align-items:center;z-index:20}
.cbar .inp{border-radius:24px;height:46px}
.cbar .ib{background:var(--card);border-radius:50%}
.gem-hero{border-radius:22px;padding:20px 16px;text-align:center;background:linear-gradient(160deg,#0B3A8F,#0A6CFF 60%,#2E9BFF);color:#fff}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:.8rem;color:var(--pri2)}
.lbr{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border-radius:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal span{font-size:.7rem;color:var(--tx3);padding:4px 0}
.cal button{aspect-ratio:1;border-radius:50%;font-size:.82rem;position:relative}
.cal button.o{color:var(--tx3);opacity:.4}
.cal button.td{box-shadow:inset 0 0 0 1.5px var(--tx2)}
.cal button.sl{background:var(--pri);color:#fff}
.cal button i{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%}
.art{display:flex;gap:12px;padding:10px;background:var(--card);border-radius:16px;width:100%;text-align:left}
.art .th{width:84px;height:84px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:2.2rem}
.art h4{font-size:.88rem;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.art p{font-size:.72rem;color:var(--tx2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.reader{font-size:1rem;line-height:1.65}
.reader p{margin:10px 0}
.reader h2{font-size:1.4rem;line-height:1.3;margin:14px 0 6px}
.reader h3{font-size:1.05rem;margin:16px 0 4px}
.kb{width:140px;height:180px;border-radius:18px;background:linear-gradient(160deg,#E6F0FF,#C9E0FF);color:#0B1A3A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;text-align:center;position:relative;flex:none}
.kb .d{position:absolute;bottom:10px;right:10px;background:rgba(11,26,58,.75);color:#fff;font-size:.7rem;padding:3px 8px;border-radius:9px;display:flex;align-items:center;gap:4px}
.story{position:fixed;inset:0;background:#000;z-index:80;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
.prog{display:flex;gap:4px;padding:12px 14px 8px}
.prog i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
.prog i b{display:block;height:100%;background:#fff;width:0}
.pin{display:grid;grid-template-columns:repeat(3,72px);gap:16px;justify-content:center}
.pin button{width:72px;height:72px;border-radius:50%;background:var(--card);font-size:1.6rem;font-weight:600}
.pdots{display:flex;gap:14px;justify-content:center;margin:24px 0 36px}
.pdots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--tx3)}
.pdots i.f{background:var(--pri);border-color:var(--pri)}
.plan{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--card);width:100%;text-align:left;border:1.5px solid transparent}
.plan.on{border-color:var(--pri);background:var(--soft)}
.rad{width:20px;height:20px;border-radius:50%;border:2px solid var(--tx3);display:grid;place-items:center;flex:none}
.rad.on{border-color:var(--pri)}
.rad.on::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--pri)}
.feat{background:var(--card);border-radius:14px;padding:12px;text-align:center}
.qrw{position:fixed;inset:0;background:#000;z-index:70;max-width:480px;margin:0 auto;display:flex;flex-direction:column;color:#fff}
.qrw video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.qbox{width:66vw;max-width:290px;aspect-ratio:1;border-radius:22px;box-shadow:0 0 0 2000px rgba(0,0,0,.55);border:2.5px solid #fff;position:relative}
.qbox::after{content:'';position:absolute;left:8%;right:8%;height:2px;background:var(--pri2);box-shadow:0 0 12px var(--pri2);animation:scan 2s infinite ease-in-out}
@keyframes scan{0%,100%{top:10%}50%{top:88%}}
.whs{position:relative;display:flex;align-items:stretch;margin-top:10px}
.whs::before{content:'';position:absolute;left:0;right:0;top:76px;height:40px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--soft);border-radius:4px;pointer-events:none;opacity:.55}
.wheel{flex:1;height:192px;overflow-y:scroll;scroll-snap-type:y mandatory;scroll-padding-top:76px;text-align:center;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);position:relative;z-index:1;overscroll-behavior:contain}
.wheel::-webkit-scrollbar{display:none}
.wheel .sp{height:76px}
.wheel .wi{height:40px;line-height:40px;scroll-snap-align:start;color:var(--tx3);font-size:1.02rem;transition:color .15s,font-size .15s;cursor:pointer;white-space:nowrap}
.wheel .wi.n1{color:var(--tx2)}
.wheel .wi.on{color:var(--tx);font-weight:800;font-size:1.28rem}
.wcol{display:grid;place-items:center;font-size:1.4rem;font-weight:800;width:30px;z-index:1}
.dtab{flex:1;height:48px;border-radius:14px;background:var(--card);font-size:1rem;font-weight:600;border:1.5px solid transparent}
.dtab.on{border-color:var(--pri);background:var(--soft)}
.dlbl{font-size:.8rem;color:var(--tx2);margin-bottom:6px}
/* chat */
.chathd{position:sticky;top:0;z-index:6;background:var(--bg);padding-bottom:6px}
.chathd .tip{text-align:center;font-size:.74rem;line-height:1.35;color:var(--tx3);padding:0 30px;margin-top:-6px}
.cin{position:relative;flex:1}
.cin .inp{border-radius:26px;height:48px;padding-right:46px;background:var(--card);border:1px solid var(--line)}
.cin .mic{position:absolute;right:6px;top:6px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--tx2)}
.cin .mic.snd{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.cbtn{width:46px;height:46px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--tx);flex:none}

function fmt(n,cur){
  n=+n||0;const neg=n<0;n=Math.abs(n);
  const dec=(cur&&cur!=='UZS'&&n%1)?2:0;
  let s=n.toFixed(dec);let [a,b]=s.split('.');a=a.replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  return (neg?'-':'')+a+(b?','+b:'');
}

const dkey=d=>{d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const today=()=>dkey(new Date());
const hm=d=>{d=new Date(d);return pad(d.getHours())+':'+pad(d.getMinutes())};

function txEffect(t){if(t.save===false)return 0;if(t.type==='inc')return t.amount;if(t.type==='exp')return -t.amount;if(t.type==='debt')return t.dir==='take'?t.amount:-t.amount;return 0}
function balAmount(b){let s=+b.initial||0;const now=Date.now();S.tx.forEach(t=>{if(t.balanceId===b.id&&new Date(t.date)<=now)s+=txEffect(t)});return s}
function totalIn(cur){return S.balances.reduce((a,b)=>a+conv(balAmount(b),b.cur,cur),0)}
function inRange(t,from,to){const d=new Date(t.date);return d>=from&&d<=to}
function sumType(type,from,to,opt={}){return S.tx.filter(t=>t.type===type&&!t.goalId&&!(t.hide&&t.catId==='m2')&&inRange(t,from,to)&&(!opt.stat||!t.hide)&&!(S.catOv[t.catId]||{}).noStat).reduce((a,t)=>a+conv(t.amount,balById(t.balanceId).cur,S.baseCur),0)}
function pctChange(cur,prev){if(!prev)return cur?100:0;return Math.round((cur-prev)/prev*100)}

SCR.reports=p=>{
  const f=p.f||(p.f={type:p.type||'all',bals:[],from:null,to:null,cats:[],q:'',future:p.future});
  let l=S.tx.slice();
  if(f.type!=='all')l=l.filter(t=>t.type===f.type);
  if(f.bals.length)l=l.filter(t=>f.bals.includes(t.balanceId));
  if(f.cats.length)l=l.filter(t=>f.cats.includes(t.catId));
  if(f.from)l=l.filter(t=>inRange(t,new Date(f.from+'T00:00'),new Date(f.to+'T23:59:59')));
  if(f.future)l=l.filter(t=>new Date(t.date)>Date.now());
  if(f.q){const q=f.q.toLowerCase();l=l.filter(t=>(txTitle(t)+' '+catOf(t.catId).n+' '+t.amount).toLowerCase().includes(q))}
  l.sort((a,b)=>new Date(b.date)-new Date(a.date));
  const tn={all:'Barlıǵı',inc:'Kiris',exp:'Shıǵıs',debt:'Qarız'}[f.type];
  const ch=(on,t,fn)=>`<button class="chip ${on?'on':''}" onclick="${fn}">${t} ${I('chd')}</button>`;
  return `<div class="scr nopad" style="padding-bottom:90px">${topBar('Esabatlar')}
  <div class="chips">${ch(f.type!=='all',tn,'repType()')}${ch(f.bals.length,'Balans'+(f.bals.length?' ('+B(f.bals.length)+')':''),'repBal()')}${f.from?`<button class="chip on" onclick="cur().p.f.from=null;render()">${I('x')} ${B(dLong(f.from)+' — '+dLong(f.to))}</button>`:ch(false,'Barlıq dáwir','repPeriod()')}${ch(f.cats.length,'Kategoriya'+(f.cats.length?' ('+B(f.cats.length)+')':''),'repCat()')}${f.future?`<button class="chip on" onclick="cur().p.f.future=0;render()">${I('x')} Kútilmekte</button>`:''}</div>
  <div class="mt12">${txList(l)}</div>
  <div class="cbar"><div style="position:relative;flex:1"><input class="inp" id="repQ" placeholder="${Ph('Ámeliyatlardan izlew')}" value="${escA(f.q)}" oninput="cur().p.f.q=this.value;clearTimeout(window.__rq);window.__rq=setTimeout(()=>{render();const i=$('#repQ');i.focus();i.setSelectionRange(99,99)},250)" style="padding-left:40px"><span class="muted" style="position:absolute;left:14px;top:13px">${I('search')}</span></div>${f.q?`<button class="ib" onclick="cur().p.f.q='';render()">${I('x')}</button>`:''}</div></div>`;
};
function repType(){const f=cur().p.f;sheet(`${shHead('Esabatlar:')}${[['all','Barlıǵı'],['inc','Kiris'],['exp','Shıǵıs'],['debt','Qarız']].map(([k,n])=>`<button class="sel mt8" style="${f.type===k?'box-shadow:inset 0 0 0 1.5px var(--pri)':''}" onclick="cur().p.f.type='${k}';closeSheet();render()"><span>${n}</span><span class="rad ${f.type===k?'on':''}"></span></button>`).join('')}`)}
function repBal(){const f=cur().p.f;window.__rb=[...f.bals];const h=()=>`${shHead('Balanslar')}<div class="xs muted">Jeke balanslar (${B(S.balances.length)} dana)</div>${S.balances.map(b=>`<button class="sel mt8" style="${__rb.includes(b.id)?'box-shadow:inset 0 0 0 1.5px var(--pri)':''}" onclick="__rb.includes('${b.id}')?__rb.splice(__rb.indexOf('${b.id}'),1):__rb.push('${b.id}');sheetUpd(__rbh())"><span>${B(b.emoji)} ${esc(b.name)}</span><span class="rad ${__rb.includes(b.id)?'on':''}"></span></button>`).join('')}<button class="btn mt16" onclick="cur().p.f.bals=__rb;closeSheet();render()">Qollanıw</button>`;window.__rbh=h;sheet(h())}
function repPeriod(){window.__pr={from:dkey(monthStart()),to:today()};periodSheet(__pr.from,__pr.to,(a,b)=>{const f=cur().p.f;f.from=a;f.to=b;render()})}
function repCat(){const f=cur().p.f;window.__rc=[...f.cats];
 const h=()=>`${shHead('Kategoriya')}${allGroups().map(g=>`<div class="xs muted mt12">${esc(g.n)}</div><div class="cats">${g.cats.map(c=>`<button class="cat ${__rc.includes(c[0])?'on':''}" onclick="__rc.includes('${c[0]}')?__rc.splice(__rc.indexOf('${c[0]}'),1):__rc.push('${c[0]}');sheetUpd(__rch())">${catGlyph(c[0])}${esc(c[1])}</button>`).join('')}</div>`).join('')}
 <div style="position:sticky;bottom:-18px;background:var(--bg2);padding:12px 0 4px" class="row"><button class="btn sec2" onclick="__rc=[];sheetUpd(__rch())">Tazalaw</button><button class="btn" onclick="cur().p.f.cats=__rc;closeSheet();render()">Qollanıw</button></div>`;window.__rch=h;sheet(h())}
function periodSheet(from,to,fn){
  window.__pf=fn;window.__pv={from,to};
  const pre=[['Búgin',today(),today()],['Sońǵı hápte',dkey(Date.now()-6*864e5),today()],['Ótken ay',dkey(new Date(new Date().getFullYear(),new Date().getMonth()-1,1)),dkey(new Date(new Date().getFullYear(),new Date().getMonth(),0))],['Sońǵı 3 ay',dkey(new Date(Date.now()-92*864e5)),today()]];
  sheet(`${shHead('Dáwirdi tańlań')}<div class="row lbl" style="margin-bottom:7px"><span class="f1">Baslanǵısh</span><span class="f1">Juwmaqlawshı</span></div>
  <div class="row"><input class="inp f1" type="date" value="${from}" onchange="__pv.from=this.value"><input class="inp f1" type="date" value="${to}" onchange="__pv.to=this.value"></div>
  <div class="chips mt16">${pre.map(p=>`<button class="chip" onclick="closeSheet();__pf('${p[1]}','${p[2]}')">${p[0]}</button>`).join('')}</div>
  <button class="btn mt20" onclick="if(__pv.from>__pv.to)return toast('Sánelerdi tekseriń');closeSheet();__pf(__pv.from,__pv.to)">Qollanıw</button>`);
}

/* ============ STATISTICS ============ */
let ST={preset:'month',off:0,from:null,to:null,cTab:'exp',cCur:'all',calM:null,calSel:null,bal:null};
function stRange(){
  const n=new Date();
  if(ST.preset==='custom')return [new Date(ST.from+'T00:00'),new Date(ST.to+'T23:59:59')];
  if(ST.preset==='week'){const d=new Date(n);const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd+ST.off*7);d.setHours(0,0,0,0);const e=new Date(d);e.setDate(e.getDate()+6);e.setHours(23,59,59);return [d,e]}
  if(ST.preset==='month'||ST.preset==='prev'){const m=new Date(n.getFullYear(),n.getMonth()+ST.off-(ST.preset==='prev'?1:0),1);return [monthStart(m),monthEnd(m)]}
  if(ST.preset==='q3'){const e=new Date(n);e.setMonth(e.getMonth()+ST.off*3);const s=new Date(e);s.setMonth(s.getMonth()-3);s.setHours(0,0,0,0);e.setHours(23,59,59);return [s,e]}
}
const rLabel=(a,b)=>a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear()?`${a.getDate()}-${b.getDate()} ${MONs[a.getMonth()]} ${a.getFullYear()}`:`${a.getDate()} ${MONs[a.getMonth()]} - ${b.getDate()} ${MONs[b.getMonth()]} ${b.getFullYear()}`;
function donut(segs,size=150,center=''){
  const tot=segs.reduce((a,s)=>a+s.v,0);const r=54,C=2*Math.PI*r;
  if(!tot)return `<svg viewBox="0 0 140 140" width="${size}" height="${size}"><circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--card3)" stroke-width="20"/></svg>`;
  let off=0;return `<svg viewBox="0 0 140 140" width="${size}" height="${size}" style="transform:rotate(-90deg)">${segs.map(s=>{const l=s.v/tot*C;const el=`<circle cx="70" cy="70" r="${r}" fill="none" stroke="${s.c}" stroke-width="20" stroke-dasharray="${Math.max(l-1.5,0.5)} ${C}" stroke-dashoffset="${-off}"/>`;off+=l;return el}).join('')}</svg>`;
}
const noData=`<div class="card2 mt12" style="text-align:center;font-size:.8rem;color:var(--tx2);padding:14px">Bul dáwir ushın maǵlıwmat joq</div>`;
SCR.stats=()=>{
  const [a,b]=stRange();
  const tx=S.tx.filter(t=>inRange(t,a,b)&&!t.hide&&!(S.catOv[t.catId]||{}).noStat);
  const cv=t=>conv(t.amount,balById(t.balanceId).cur,S.baseCur);
  const pool=tx.filter(t=>t.type!=='debt'&&(ST.cCur==='all'||t.balanceId===ST.cCur)&&(ST.cTab==='all'||t.type===ST.cTab));
  const byC={};pool.forEach(t=>{byC[t.catId]=(byC[t.catId]||0)+cv(t)});
  const cs=Object.entries(byC).sort((x,y)=>y[1]-x[1]);const ctot=cs.reduce((s,x)=>s+x[1],0);
  const palette=['#0A6CFF','#22C55E','#F59E0B','#EF4444','#7DB8FF','#06B6D4','#EC4899','#F97316','#14B8A6','#64748B'];
  const segC=cs.map(([id,v],i)=>({v,c:catOf(id).c||palette[i%10],id}));
  const incT=tx.filter(t=>t.type==='inc').reduce((s,t)=>s+cv(t),0),expT=tx.filter(t=>t.type==='exp').reduce((s,t)=>s+cv(t),0);
  const byB={};tx.filter(t=>t.type==='exp').forEach(t=>{byB[t.balanceId]=(byB[t.balanceId]||0)+cv(t)});
  const segB=Object.entries(byB).map(([id,v])=>({v,c:balById(id).color,id}));
  const deb=tx.filter(t=>t.type==='debt');const dg=deb.filter(t=>t.dir==='give').reduce((s,t)=>s+cv(t),0),dt=deb.filter(t=>t.dir==='take').reduce((s,t)=>s+cv(t),0);
  const presets=[['week','Usı hápte'],['month','Usı ay'],['prev','Ótken ay'],['q3','Sońǵı 3 ay']];
  return `<div class="scr">${topBar('Statistika',`<button class="ib" onclick="periodSheet(dkey(stRange()[0]),dkey(stRange()[1]),(x,y)=>{ST.preset='custom';ST.from=x;ST.to=y;render()})">${I('cal')}</button>`,1)}
  <div class="row sb"><button class="ib" onclick="stNav(-1)">${I('chl')}</button><b>${B(rLabel(a,b))}</b><button class="ib" onclick="stNav(1)">${I('chr')}</button></div>
  <div class="chips mt8">${presets.map(([k,n])=>`<button class="chip ${ST.preset===k?'on':''}" onclick="ST.preset='${k}';ST.off=0;render()">${n}</button>`).join('')}</div>
  <div class="card mt12"><div class="row sm b" style="gap:6px">Kategoriyalar boyınsha <span class="mut3">${I('info')}</span></div>
   <div class="chips mt12"><button class="chip ${ST.cCur==='all'?'on':''}" style="padding:6px 12px" onclick="ST.cCur='all';render()">${B('🇺🇿 '+S.baseCur)}</button>${S.balances.map(x=>`<button class="chip ${ST.cCur===x.id?'on':''}" style="padding:6px 12px" onclick="ST.cCur='${x.id}';render()">${B(x.emoji)} ${esc(x.name)}</button>`).join('')}</div>
   <div style="display:grid;place-items:center;margin-top:14px;position:relative">${donut(segC,160)}<div style="position:absolute;text-align:center"><div class="xs muted">${ST.cTab==='inc'?'Kiris':ST.cTab==='exp'?'Shıǵıs':'Barlıǵı'}</div><div class="b">${B(fmt(ctot))}</div></div></div>
   <div class="seg mt12" style="background:transparent">${[['all','Barlıǵı'],['inc','Kiris'],['exp','Shıǵıs']].map(([k,n])=>`<button class="${ST.cTab===k?'on':''}" onclick="ST.cTab='${k}';render()">${n}</button>`).join('')}</div>
   ${cs.length?cs.map(([id,v],i)=>`<div class="row mt12">${catIcon(id,34)}<div class="f1"><div class="row sb sm"><span class="ell">${esc(catOf(id).n)}</span><b>${B(fmt(v))}</b></div><div class="bar" style="margin-top:6px"><i style="width:${v/ctot*100}%;background:${segC[i].c}"></i></div></div><span class="xs muted" style="width:34px;text-align:right">${B(Math.round(v/ctot*100)+'%')}</span></div>`).join(''):noData}
  </div>
  <div class="g2 mt12"><div class="st"><div class="xs muted">Kiris</div><div class="v cg">${B(fmt(incT))}</div></div><div class="st"><div class="xs muted">Shıǵıs</div><div class="v cr">${B(fmt(expT))}</div></div></div>
  <div class="card mt12"><div class="row sm b" style="gap:6px">Balanslar boyınsha <span class="mut3">${I('info')}</span></div>
   ${segB.length?`<div class="row mt12" style="gap:16px">${donut(segB,120)}<div class="f1">${segB.map(s=>`<div class="lgd"><i style="background:${s.c}"></i><span class="f1">${esc(balById(s.id).name)}</span><b>${B(fmt(s.v))}</b></div>`).join('')}</div></div>`:`<div style="display:grid;place-items:center;margin-top:12px">${donut([],120)}</div>${noData}`}</div>
  <div class="card mt12"><div class="row sm b" style="gap:6px">Alıs-berisler <span class="mut3">${I('info')}</span></div>
   <div class="row mt12" style="gap:16px">${donut([{v:dg,c:'#0A6CFF'},{v:dt,c:'#7DB8FF'}],120)}<div class="f1"><div class="lgd"><i style="background:var(--pri)"></i><span class="f1">Berilgen</span><b>${B(fmt(dg))}</b></div><div class="lgd"><i style="background:#7DB8FF"></i><span class="f1">Alınǵan</span><b>${B(fmt(dt))}</b></div><div class="lgd"><i style="background:var(--tx3)"></i><span class="f1">Qarızlar</span><b>${B(deb.length)}</b></div></div></div>
   ${deb.length?'':noData}</div>
  ${calendarCard()}
  ${balChart(a,b)}
  </div>`;
};
function stNav(d){if(ST.preset==='custom'){ST.preset='month';ST.off=0}else ST.off+=d;render()}
function calendarCard(){
  const n=new Date();const m=ST.calM?new Date(ST.calM):new Date(n.getFullYear(),n.getMonth(),1);
  const first=(m.getDay()+6)%7;const days=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
  const byD={};S.tx.forEach(t=>{const d=new Date(t.date);if(d.getMonth()===m.getMonth()&&d.getFullYear()===m.getFullYear()&&t.type!=='debt'){const k=d.getDate();byD[k]=byD[k]||{i:0,e:0};byD[k][t.type==='inc'?'i':'e']+=conv(t.amount,balById(t.balanceId).cur,'UZS')}});
  const sel=ST.calSel&&new Date(ST.calSel).getMonth()===m.getMonth()?new Date(ST.calSel).getDate():null;
  const prevDays=new Date(m.getFullYear(),m.getMonth(),0).getDate();
  let cells='';for(let i=0;i<first;i++)cells+=`<button class="o">${B(prevDays-first+i+1)}</button>`;
  for(let d=1;d<=days;d++){const isT=d===n.getDate()&&m.getMonth()===n.getMonth()&&m.getFullYear()===n.getFullYear();const v=byD[d];
    cells+=`<button class="${isT?'td':''} ${sel===d?'sl':''}" onclick="ST.calSel=new Date(${m.getFullYear()},${m.getMonth()},${d}).toISOString();render()">${B(d)}${S.ny&&m.getMonth()===11&&d===31?'<b class="ct">🎄</b>':''}${v?`<i style="background:${v.e>=v.i?'var(--red)':'var(--green)'}"></i>`:''}</button>`}
  const rest=(7-(first+days)%7)%7;for(let i=1;i<=rest;i++)cells+=`<button class="o">${B(i)}</button>`;
  const mi=Object.values(byD).reduce((s,v)=>s+v.i,0),me=Object.values(byD).reduce((s,v)=>s+v.e,0);
  const sv=sel?byD[sel]||{i:0,e:0}:{i:mi,e:me};
  return `<div class="card mt12"><div class="row sb"><span class="row sm b" style="gap:6px">Kalendar <span class="mut3">${I('info')}</span></span><span class="row sm"><button onclick="calNav(-1)">${I('chl')}</button><span style="min-width:96px;text-align:center">${MON[m.getMonth()]}, ${B(m.getFullYear())}</span><button onclick="calNav(1)">${I('chr')}</button></span></div>
  <div class="cal mt12">${WD.map(w=>`<span>${w}</span>`).join('')}${cells}</div>
  <div class="row sb mt12 sm"><span class="b">${sel?B(sel+' '+MON[m.getMonth()].toLowerCase()+', '+m.getFullYear()):'Ay boyınsha (kúndi basıń)'}</span><b>${B(fmt(sv.i-sv.e))} ${curL('UZS')}</b></div>
  <div class="row sb mt8 sm"><span class="cg">↓ Kiris</span><span>${B(fmt(sv.i))} ${curL('UZS')}</span></div><div class="row sb mt8 sm"><span class="cr">↑ Shıǵıs</span><span>${B(fmt(sv.e))} ${curL('UZS')}</span></div></div>`;
}
function calNav(d){const n=new Date();const m=ST.calM?new Date(ST.calM):new Date(n.getFullYear(),n.getMonth(),1);m.setMonth(m.getMonth()+d);ST.calM=m.toISOString();ST.calSel=null;render()}
function balChart(a,b){
  const bal=ST.bal&&S.balances.find(x=>x.id===ST.bal)||S.balances[0];
  const days=Math.max(1,Math.round((b-a)/864e5));const N=Math.min(days,31);const pts=[];
  const step=(b-a)/N;
  for(let i=0;i<=N;i++){const t=new Date(a.getTime()+step*i);let s=+bal.initial||0;S.tx.forEach(x=>{if(x.balanceId===bal.id&&new Date(x.date)<=t)s+=txEffect(x)});pts.push(s)}
  const mx=Math.max(...pts,1),mn=Math.min(...pts,0);const W=300,H=120;
  const xy=pts.map((v,i)=>[i/N*W,H-((v-mn)/(mx-mn||1))*H*0.9-6]);
  const path=xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<div class="card mt12"><div class="row sm b" style="gap:6px">Balanslar jaǵdayı <span class="mut3">${I('info')}</span></div>
  <div class="chips mt12">${S.balances.map(x=>`<button class="chip ${x.id===bal.id?'on':''}" style="padding:6px 12px" onclick="ST.bal='${x.id}';render()">${B(x.emoji)} ${esc(x.name)}</button>`).join('')}</div>
  <svg viewBox="0 -4 ${W} ${H+24}" style="width:100%;margin-top:12px"><defs><linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A6CFF" stop-opacity=".45"/><stop offset="1" stop-color="#0A6CFF" stop-opacity="0"/></linearGradient></defs>
  ${[0,.5,1].map(f=>`<line x1="0" x2="${W}" y1="${H*f}" y2="${H*f}" stroke="var(--line)" stroke-dasharray="3 4"/>`).join('')}
  <path d="${path} L${W} ${H} L0 ${H}Z" fill="url(#gl)"/><path d="${path}" fill="none" stroke="#2E9BFF" stroke-width="2.2" stroke-linejoin="round"/>
  <text x="0" y="${H+16}" font-size="9" fill="var(--tx3)">${B(a.getDate()+' '+MONs[a.getMonth()])}</text><text x="${W}" y="${H+16}" font-size="9" fill="var(--tx3)" text-anchor="end">${B(b.getDate()+' '+MONs[b.getMonth()])}</text>
  <text x="${W}" y="10" font-size="9" fill="var(--tx3)" text-anchor="end">${B(fmt(mx,bal.cur))}</text></svg>
  <div class="row sb sm mt8"><span class="muted">Házirgi qaldıq</span><b>${money(balAmount(bal),bal.cur)}</b></div></div>`;
}

function parseAmount(s){
  s=s.toLowerCase().replace(/(\d)\s+(?=\d{3}\b)/g,'$1');
  const m=s.match(/(\d+(?:[.,]\d+)?)\s*(mıń|miń|ming|ming|min|k|mln|million|mlrd|ming\b|\$|usd|dollar)?/);
  if(!m)return null;let v=parseFloat(m[1].replace(',','.'));const u=m[2]||'';
  if(/^(mıń|miń|ming|ming|min|k)$/.test(u))v*=1e3;else if(/^(mln|million)$/.test(u))v*=1e6;else if(u==='mlrd')v*=1e9;
  return {v,usd:/(\$|usd|dollar)/.test(s)};
}
function guessCat(s,type){
  s=s.toLowerCase();let best=null;
  for(const id in KW){if(KW[id].split(' ').some(w=>w.length>2&&s.includes(w))){if(type==='inc'&&!catOf(id).inc)continue;if(type==='exp'&&catOf(id).inc)continue;best=id;break}}
  if(!best)for(const id in CAT){const n=CAT[id].n.toLowerCase();if(n.length>3&&s.includes(n.slice(0,Math.max(4,n.length-2)))){best=id;break}}
  return best||(type==='inc'?'i1':'o2');
}
function sendChat(txt){
  const inp=$('#chatIn');const t=(txt||inp&&inp.value||'').trim();if(!t)return;if(inp)inp.value='';

  setTimeout(()=>{S.chat.push({f:'ai',t:aiReply(t),d:Date.now()});save();render()},650);
}
function aiReply(t){
  const s=t.toLowerCase();const ms=monthStart(),me=monthEnd();
  if(/^(balans|qaldıq|qaldiq|баланс)/.test(s))return 'Balans:\n'+S.balances.map(b=>`${B(b.emoji)} ${esc(b.name)}: ${money(balAmount(b),b.cur)}`).join('\n')+`\n\n💼 Ulıwma: ${money(totalIn('UZS'),'UZS')}`;
  if(/(usı ay|usi ay|statistika|bul ay|hisobot)/.test(s)){const i=sumType('inc',ms,me),e=sumType('exp',ms,me);return `📊 ${MON[new Date().getMonth()]} ayı:\n🟢 Kiris: ${money(i)}\n🔴 Shıǵıs: ${money(e)}\n💰 Parıq: ${money(i-e)}\n🧾 Esabatlar: ${B(S.tx.filter(x=>inRange(x,ms,me)).length)} dana`}
  if(/^(sálem|salem|salom|assalaw|привет|hi|hello)/.test(s))return 'Sálem! 😊 Qárejet yamasa kiristi jazıń, men esapqa alaman. Mısalı: «kofe 18 mıń».';
  const a=parseAmount(s);
  if(!a)return `${esc(t)} ushın qansha hám qaysı esaptan tólegenińizdi jazıń — mısalı «${esc(t)} 20 mıń, Som esabınan».`;
  const isInc=/(kiris|kirim|aylıq|ayliq|oylik|dáramat|daromad|tústi|tushdi|aldım|keshbek|sıylıq aldım|zarplata|avans|sattım)/.test(s);
  const isDebt=/(qarız|qarz)/.test(s);
  let bal=S.balances.find(b=>s.includes(b.name.toLowerCase()))||(a.usd?S.balances.find(b=>b.cur==='USD'):null)||S.balances.find(b=>b.cur==='UZS')||S.balances[0];
  let amt=a.v;if(a.usd&&bal.cur!=='USD')amt=conv(a.v,'USD',bal.cur);
  if(isDebt){const dir=/(aldım|aldim|oldim)/.test(s)?'take':'give';const name=(t.match(/([A-ZÁÓÚÍǴŃ][a-záóúıǵńA-Z]+)/)||[])[1]||'';
    const o={id:uid(),type:'debt',dir,amount:amt,balanceId:bal.id,catId:'m1',note:'',person:name,date:new Date().toISOString(),save:true};S.tx.push(o);onNewTx(o);
    return `🤝 Qarız ${dir==='give'?'berildi':'alındı'}${name?' — '+esc(name):''}\n${dir==='give'?'🔴':'🟢'} ${money(amt,bal.cur)}\n${B(bal.emoji)} ${esc(bal.name)} qaldıǵı: ${money(balAmount(bal),bal.cur)}`}
  const type=isInc?'inc':'exp';const cat=guessCat(s,type);
  const note=t.replace(/\d[\d\s.,]*\s*(mıń|miń|ming|min|k|mln|million|so'm|som|sum|uzs|\$|usd|dollar)?/gi,'').replace(/\b(kiris|shıǵıs|esabınan|hisobidan|dan)\b/gi,'').replace(/\s+/g,' ').trim();
  const c=catOf(cat);const title=(note?note[0].toUpperCase()+note.slice(1):c.n)+' — '+(type==='inc'?'Kiris':'Shıǵıs');
  const o={id:uid(),type,amount:Math.round(amt*100)/100,balanceId:bal.id,catId:cat,note:title,date:new Date().toISOString(),save:true,hide:false};
  S.tx.push(o);onNewTx(o);
  const mExp=sumType(type,ms,me);
  return `${B(c.e)} ${esc(c.n)}\n${type==='inc'?'🟢':'🔴'} ${type==='inc'?'+':'-'}${money(o.amount,bal.cur)}\n📝 ${esc(title)}\n\n${type==='inc'?'📈 Bul ay kiris':'📉 Bul ay shıǵıs'}: ${B(fmt(mExp))}\n${B(bal.emoji)} ${esc(bal.name)} qaldıǵı: ${money(balAmount(bal),bal.cur)}\n\n<button class="pill" onclick="openTx('${o.id}')">${I('edit')} Ózgertiw</button>`;
}

const LEVELS=[['Baslawshı',0,500],['Tájiriybeli',500,2000],['Sheber',2000,5000],['Ustaz',5000,1e9]];
const lvl=()=>{const t=S.gem.total;return LEVELS.find(l=>t>=l[1]&&t<l[2])};
function award(n,why){S.gem.total+=n;S.gem.avail+=n;save();toast(`+${B(n)} 💎 ${why||''}`)}
function dailyCheck(){
  const g=S.gem,t=today();if(g.last===t)return;
  const y=dkey(Date.now()-864e5);
  if(g.last===y)g.streak++;else if(g.last&&g.freeze>0){g.freeze--;g.streak++}else g.streak=1;
  g.best=Math.max(g.best,g.streak);g.last=t;g.daily={d:t,tx:0,sort:0};
  g.total+=5;g.avail+=5;save();setTimeout(()=>toast('Kúnlik kiriw: +5 💎 · seriya '+B(g.streak)+' 🔥'),1400);
}
function onNewTx(o){const g=S.gem;if(g.daily.d!==today())g.daily={d:today(),tx:0,sort:0};
  if(g.daily.tx<5){g.daily.tx++;award(5,'tranzakciya ushın')}
  if(o.catId&&o.catId!=='o2'&&g.daily.sort<5){g.daily.sort++}
  const b=balById(o.balanceId);if(o.type==='exp'&&b.limit){const sp=S.tx.filter(t=>t.balanceId===b.id&&t.type==='exp'&&inRange(t,monthStart(),monthEnd())).reduce((a,t)=>a+t.amount,0);if(sp>b.limit){addNote('Limit asıldı ⚠️',`«${b.name}» balansı boyınsha aylıq limit (${fmt(b.limit)}) asıp ketti. Usı ay shıǵıs: ${fmt(sp)}.`);setTimeout(()=>toast('⚠️ «'+esc(b.name)+'» limiti asıldı'),2400)}}
  const cl=(S.catOv[o.catId]||{}).limit;if(o.type==='exp'&&cl){const sp=S.tx.filter(t=>t.catId===o.catId&&t.type==='exp'&&inRange(t,monthStart(),monthEnd())).reduce((a,t)=>a+conv(t.amount,balById(t.balanceId).cur,'UZS'),0);if(sp>cl){addNote('Kategoriya limiti asıldı',`«${catOf(o.catId).n}» kategoriyası boyınsha aylıq limit asıldı: ${fmt(sp)} / ${fmt(cl)}.`)}}
}

  document.body.appendChild(d);

    if('BarcodeDetector' in window){const bd=new BarcodeDetector({formats:['qr_code']});
      const loop=async()=>{if(!$('#qrw'))return;try{const r=await bd.detect(v);if(r.length){qrResult(r[0].rawValue);return}}catch(e){}requestAnimationFrame(loop)};loop()}
    else $('#qmsg').innerHTML=L('Bul brauzerde QR tanıw joq — kodtı qolda kirgiziń');
  }catch(e){$('#qmsg').innerHTML=L('Kameraǵa ruxsat berilmedi. Brauzer sazlamalarında ruxsat beriń.')}

function avatarPick(){const f=$('#fileIn');f.value='';f.accept='image/*';f.removeAttribute('capture');f.onchange=()=>{const file=f.files[0];if(!file)return;const r=new FileReader();r.onload=()=>shrink(r.result,img=>{shrink2(img,a=>{S.profile.avatar=a;save();render()})});r.readAsDataURL(file)};f.click()}
function shrink2(src,cb){const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,160,160);cb(c.toDataURL('image/jpeg',.8))};im.src=src}

/* export / import / clear */
function premiumGate(title){sheet(`${shHead(title+' — Premium')}<p class="sm muted">Bul premium imkaniyat. Obuna menen siz tómendegilerge iye bolasız:</p><div class="col mt12 sm" style="gap:8px"><div>📥 Júklep alıw</div><div>📊 Keńeytilgen statistika</div><div>🤝 Qarızlar nazareti</div></div>

 <p class="xs muted mt12" style="text-align:center">Yamasa Almazlar dúkanında 💎 menen premium kún alıń</p>`)}
function exportData(){if(!isPrem())return premiumGate('Esabattı júklep alıw');
 const rows=[['Sáne','Túri','Summa','Valyuta','Balans','Kategoriya','Izoh']];
 S.tx.slice().sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(t=>{const b=balById(t.balanceId);rows.push([dFull(t.date),{inc:'Kiris',exp:'Shıǵıs',debt:'Qarız'}[t.type],t.amount,b.cur,b.name,t.type==='debt'?(t.person||''):catOf(t.catId).n,t.note||''])});
 const csv='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='karman-esabatlar-'+today()+'.csv';a.click();
 const j=document.createElement('a');j.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));j.download='karman-zapas-'+today()+'.json';setTimeout(()=>j.click(),400);
 toast('Excel (CSV) hám zapas fayl júklendi ✓')}
function importData(){const f=$('#fileIn');f.value='';f.accept='.csv,.json,text/csv,application/json';f.removeAttribute('capture');
 f.onchange=()=>{const file=f.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{
  if(file.name.endsWith('.json')){const d=JSON.parse(r.result);if(!d.v||!d.tx)throw 0;confirmBox('Zapas nusqanı tiklew',`${B(d.tx.length)} esabat tabıldı. Házirgi maǵlıwmatlar almastırıladı.`,'Tiklew',()=>{S=d;save();buildCats();applyTheme();render();toast('Tiklendi ✓')},false);return}
  const lines=r.result.replace(/^\ufeff/,'').split(/\r?\n/).filter(Boolean);let n=0;
  lines.slice(1).forEach(l=>{const c=l.split(/;(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(x=>x.replace(/^"|"$/g,'').replace(/""/g,'"'));if(c.length<3)return;
   const [dt,tp,am,cu,bn,cn,nt]=c;const m=dt.match(/(\d\d)\.(\d\d)\.(\d{4})\s*(\d\d:\d\d)?/);const date=m?new Date(`${m[3]}-${m[2]}-${m[1]}T${m[4]||'12:00'}`):new Date(dt);if(isNaN(date))return;
   const type=/kiris|kirim|inc/i.test(tp)?'inc':/qar/i.test(tp)?'debt':'exp';const bal=S.balances.find(b=>b.name===bn)||S.balances.find(b=>b.cur===(cu||'UZS'))||S.balances[0];
   const cat=Object.values(CAT).find(x=>x.n===cn);S.tx.push({id:uid(),type,amount:Math.abs(parseFloat(String(am).replace(/\s/g,'').replace(',','.')))||0,balanceId:bal.id,catId:cat?cat.id:(type==='inc'?'i1':'o2'),note:nt||'',date:date.toISOString(),save:true,dir:'give',person:type==='debt'?cn:''});n++});
  save();render();toast(B(n)+' esabat import qılındı ✓')}catch(e){toast('Fayl formatı qáte')}};r.readAsText(file)};f.click()}
let CL={};
function clearSheet(){CL={from:'',to:'',bal:'all',type:'all',note:''};sheet(clHTML())}
function clHTML(){return `${shHead('Esabatlardı tazalaw')}<div class="card2 xs" style="background:rgba(242,84,91,.12);color:var(--red)">Barlıq kiritilgen esabatlar óshiriledi hám esabatlardı qayta tiklew múmkin emes!</div>
 <div class="lbl">Dáwir</div><button class="sel" onclick="periodSheet(CL.from||dkey(monthStart()),CL.to||today(),(a,b)=>{CL.from=a;CL.to=b;sheetUpd(clHTML())})"><span>${CL.from?B(dLong(CL.from)+' — '+dLong(CL.to)):'Tolıq dáwir'}</span>${I('chd')}</button>
 <div class="lbl">Balans</div><button class="sel" onclick="CL.bal=CL.bal==='all'?S.balances[0].id:(S.balances[S.balances.findIndex(b=>b.id===CL.bal)+1]||{id:'all'}).id;sheetUpd(clHTML())"><span>${CL.bal==='all'?'Barlıq balanslar':B(balById(CL.bal).emoji)+' '+esc(balById(CL.bal).name)}</span>${I('swaph')}</button>
 <div class="lbl">Túri</div><div class="g2">${[['all','Barlıǵı'],['inc','Kiris'],['exp','Shıǵıs'],['debt','Qarız']].map(([k,n])=>`<button class="sel" style="justify-content:center;${CL.type===k?'box-shadow:inset 0 0 0 1.5px var(--pri);color:var(--pri2)':''}" onclick="CL.type='${k}';sheetUpd(clHTML())">${n}</button>`).join('')}</div>
 <div class="lbl">Izoh</div><input class="inp" placeholder="${Ph('Sebebin kirgiziń')}" value="${escA(CL.note)}" oninput="CL.note=this.value">
 <button class="btn red mt20" onclick="doClear()">Tazalaw</button>`}
function doClear(){const match=t=>(CL.type==='all'||t.type===CL.type)&&(CL.bal==='all'||t.balanceId===CL.bal)&&(!CL.from||inRange(t,new Date(CL.from+'T00:00'),new Date(CL.to+'T23:59:59')));
 const n=S.tx.filter(match).length;if(!n)return toast('Tazalaw ushın esabat joq');
 confirmBox('Tastıyıqlaw',`${B(n)} esabat óshiriledi. Dawam etesiz be?`,'Óshiriw',()=>{S.tx=S.tx.filter(t=>!match(t));save();closeSheet(1);render();toast(B(n)+' esabat óshirildi')})}

/* ============ WHEEL PICKERS (scroll barabanı) ============ */
const WH=40;
const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const YEARS=range(2018,2035);
function wheelCol(key,items,sel){return `<div class="wheel" data-k="${key}"><div class="sp"></div>${items.map((t,i)=>`<div class="wi" data-i="${i}">${t}</div>`).join('')}<div class="sp"></div></div>`.replace(`data-i="${sel}">`,`data-i="${sel}" data-sel="1">`)}
function markWheel(w,i){w.querySelectorAll('.wi').forEach((x,j)=>{x.classList.toggle('on',j===i);x.classList.toggle('n1',Math.abs(j-i)===1)})}
function initWheels(root,onChange){
  root.querySelectorAll('.wheel').forEach(w=>{
    const items=w.querySelectorAll('.wi');let sel=[...items].findIndex(x=>x.dataset.sel);if(sel<0)sel=0;
    w.scrollTop=sel*WH;markWheel(w,sel);let last=sel,t;
    w.addEventListener('scroll',()=>{const i=Math.max(0,Math.min(items.length-1,Math.round(w.scrollTop/WH)));if(i!==last){last=i;markWheel(w,i);if(navigator.vibrate)try{navigator.vibrate(4)}catch(e){}}
      clearTimeout(t);t=setTimeout(()=>onChange(w.dataset.k,i,w),90)},{passive:true});
    items.forEach((x,j)=>x.addEventListener('click',()=>w.scrollTo({top:j*WH,behavior:'smooth'})));
  });
}
const lastSheetEl=()=>sheets.length?sheets[sheets.length-1].o:null;
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const dLbl=d=>`${d.getDate()} ${MONs[d.getMonth()]}, ${d.getFullYear()}`;

/* ---------- Sana va vaqt ---------- */
let DP={};
function datePick(iso,fn,title='Sana va vaqt'){DP={d:new Date(iso),tab:'date',fn,title};sheet(dpHTML());dpInit()}
function dpHTML(){const d=DP.d;
  const wheels=DP.tab==='date'
   ?`<div class="whs">${wheelCol('d',range(1,dim(d.getFullYear(),d.getMonth())).map(String),d.getDate()-1)}<div style="flex:1.5;display:flex">${wheelCol('m',MON,d.getMonth())}</div>${wheelCol('y',YEARS.map(String),YEARS.indexOf(d.getFullYear()))}</div>`
   :`<div class="whs" style="padding:0 30px">${wheelCol('h',range(0,23).map(pad),d.getHours())}<div class="wcol">:</div>${wheelCol('mi',range(0,59).map(pad),d.getMinutes())}</div>
     <div class="chips mt12">${['10:00','12:00','18:00','20:00'].map(t=>`<button class="chip" onclick="dpTime('${t}')">${B(t)}</button>`).join('')}</div>`;
  return `${shHead(DP.title)}<div class="row mt8"><button class="dtab ${DP.tab==='date'?'on':''}" id="dpD" onclick="DP.tab='date';sheetUpd(dpHTML());dpInit()">${B(dLbl(d))}</button><button class="dtab ${DP.tab==='time'?'on':''}" id="dpT" onclick="DP.tab='time';sheetUpd(dpHTML());dpInit()">${B(hm(d))}</button></div>
  ${wheels}
  ${DP.tab==='date'?`<div class="chips mt12">${[['Búgin',0],['Keshe',-1],['Ertege',1]].map(([n,o])=>`<button class="chip" onclick="dpDay(${o})">${n}</button>`).join('')}</div>`:''}
  <button class="btn mt16" onclick="closeSheet();DP.fn(DP.d.toISOString())">Qollanıw</button>`;
}
function dpLabels(){const a=$('#dpD'),b=$('#dpT');if(a)a.innerHTML=L(B(dLbl(DP.d)));if(b)b.innerHTML=L(B(hm(DP.d)))}
function dpInit(){initWheels(lastSheetEl(),(k,i,w)=>{const d=DP.d;
  if(k==='d')d.setDate(i+1);
  if(k==='h')d.setHours(i);if(k==='mi')d.setMinutes(i);
  if(k==='m'||k==='y'){const day=d.getDate();const y=k==='y'?YEARS[i]:d.getFullYear(),m=k==='m'?i:d.getMonth();const n=dim(y,m);d.setDate(1);d.setFullYear(y);d.setMonth(m);d.setDate(Math.min(day,n));
    const dw=lastSheetEl().querySelector('.wheel[data-k=d]');if(dw&&dw.querySelectorAll('.wi').length!==n){sheetUpd(dpHTML());return dpInit()}}
  dpLabels()})}
function dpDay(o){const n=new Date(Date.now()+o*864e5);DP.d.setFullYear(n.getFullYear(),n.getMonth(),n.getDate());sheetUpd(dpHTML());dpInit()}
function dpTime(t){const [h,m]=t.split(':');DP.d.setHours(+h,+m);sheetUpd(dpHTML());dpInit()}

function prPre(v){const n=new Date();n.setHours(12,0,0,0);let a=new Date(n),b=new Date(n);

  <div class="g2 mt16" style="grid-template-columns:repeat(3,1fr)"><div class="st" style="text-align:center"><div class="xs muted">Qaldı</div><div class="b sm mt8">${B(fmt(left,g.cur))}</div></div><div class="st" style="text-align:center"><div class="xs muted">Kún qaldı</div><div class="b sm mt8">${dl===null?'∞':B(Math.max(0,dl))}</div></div><div class="st" style="text-align:center"><div class="xs muted">Kúnine</div><div class="b sm mt8">${dl>0&&left?B(fmt(left/dl,g.cur)):'—'}</div></div></div>
  <div class="row mt16"><button class="btn" onclick="goalMove('${id}','in')">${I('plus')} Pul salıw</button><button class="btn sec2 ${sv>0?'':'dis'}" onclick="goalMove('${id}','out')">− Alıw</button></div>
  <div class="sec">Tariyx</div>${hist.length?hist.map(t=>{const b=balById(t.balanceId);return `<div class="row mt8 card2"><span class="gem2" style="background:${t.type==='exp'?'rgba(34,197,94,.14)':'rgba(242,84,91,.14)'};color:${t.type==='exp'?'var(--green)':'var(--red)'}">${I(t.type==='exp'?'chd':'chu')}</span><div class="f1"><div class="sm b">${t.type==='exp'?'Salındı':'Alındı'}</div><div class="xs muted">${B(b.emoji)} ${esc(b.name)} · ${B(dFull(t.date))}</div></div><b class="sm ${t.type==='exp'?'cg':'cr'}">${t.type==='exp'?'+':'−'}${money(t.amount,b.cur)}</b></div>`}).join(''):`<p class="sm muted">Ele pul salınbaǵan</p>`}`;
  if(sheets.length&&sheets[sheets.length-1].opt.goal===id)sheetUpd(html);else sheet(html,{goal:id})}
let GM={};
function goalMove(id,dir){const g=goalById(id);GM={id,dir,amt:'',bal:(S.balances.find(b=>b.cur===g.cur)||S.balances[0]).id};sheet(gmHTML())}
function gmHTML(){const g=goalById(GM.id);const sv=goalSaved(g),left=Math.max(0,g.target-sv);const b=balById(GM.bal);
  const qs=GM.dir==='in'?[['10%',g.target*.1],['25%',g.target*.25],['Qalǵanın',left]]:[['Yarımın',sv/2],['Barlıǵın',sv]];
  return `${shHead(GM.dir==='in'?'Maqsetke pul salıw':'Maqsetten pul alıw')}
  <div class="lbl">${GM.dir==='in'?'Qaysı balanstan?':'Qaysı balansqa?'}</div><button class="sel" onclick="balPick(v=>{GM.bal=v;sheetUpd(gmHTML())})"><span>${B(b.emoji)} ${esc(b.name)}</span><span class="xs muted">${money(balAmount(b),b.cur)}</span></button>
  <div class="lbl">Summa (${B(g.cur)})</div><input class="inp" id="gmA" inputmode="decimal" autofocus placeholder="0" value="${escA(GM.amt)}" oninput="GM.amt=this.value" style="font-size:1.15rem;font-weight:700">
  <div class="chips mt8">${qs.filter(q=>q[1]>0).map(([n,v])=>`<button class="chip" onclick="GM.amt='${Math.round(v*100)/100}';sheetUpd(gmHTML())">${n} · ${B(fmt(v,g.cur))}</button>`).join('')}</div>
  ${b.cur!==g.cur&&GM.amt?`<p class="xs muted mt8">≈ ${money(conv(+GM.amt.replace(',','.'),g.cur,b.cur),b.cur)}</p>`:''}
  <button class="btn mt16" onclick="doGoalMove()">${GM.dir==='in'?'Salıw':'Alıw'}</button>`}
function doGoalMove(){const g=goalById(GM.id);const a=parseFloat(String(GM.amt).replace(/\s/g,'').replace(',','.'));if(!a||a<=0)return toast('Summanı kirgiziń');
  const sv=goalSaved(g);if(GM.dir==='out'&&a>sv+0.001)return toast('Maqsette tek '+B(fmt(sv,g.cur))+' bar');
  const b=balById(GM.bal);const amt=+conv(a,g.cur,b.cur).toFixed(b.cur==='UZS'?0:2);
  S.tx.push({id:uid(),type:GM.dir==='in'?'exp':'inc',amount:amt,balanceId:b.id,catId:'m7',note:'Maqset: '+g.name,date:new Date().toISOString(),save:true,hide:true,goalId:g.id});
  const ns=goalSaved(g);closeSheet();
  if(GM.dir==='in'&&ns>=g.target&&!g.done){g.done=true;addNote('Maqset orınlandı 🎉',`«${g.name}» ushın ${fmt(g.target,g.cur)} ${g.cur} jıynaldı. Qutlıqlaymız!`);celebrate();toast('🎉 Maqset orınlandı!',3000)}
  else toast(GM.dir==='in'?'Salındı ✓':'Alındı ✓');
  if(ns<g.target)g.done=false;save();render();goalDetail(g.id)}
function delGoal(id){const g=goalById(id);const sv=goalSaved(g);
  confirmBox('Maqsetti óshiriw',sv>0?`Jıynalǵan ${B(fmt(sv,g.cur))} ${B(g.cur)} balansıńızǵa qaytarıladı.`:'Bul maqset óshiriledi.','Óshiriw',()=>{
    if(sv>0){const b=S.balances.find(x=>x.cur===g.cur)||S.balances[0];S.tx.push({id:uid(),type:'inc',amount:+conv(sv,g.cur,b.cur).toFixed(b.cur==='UZS'?0:2),balanceId:b.id,catId:'m7',note:'Maqset jabıldı: '+g.name,date:new Date().toISOString(),save:true,hide:true})}
    S.tx.forEach(t=>{if(t.goalId===id)delete t.goalId});S.goals=S.goals.filter(x=>x.id!==id);save();closeSheet(1);render();toast('Maqset óshirildi')})}
function celebrate(){const box=document.createElement('div');box.className='confetti';const cs=['#0A6CFF','#7DB8FF','#FFFFFF','#FFD36B','#FF5A6E'];
  box.innerHTML=Array.from({length:70},(_,i)=>`<i style="left:${Math.random()*100}%;background:${cs[i%5]};animation-delay:${Math.random()*.6}s;animation-duration:${1.8+Math.random()*1.4}s;transform:rotate(${Math.random()*360}deg)"></i>`).join('');
  document.body.appendChild(box);if(navigator.vibrate)try{navigator.vibrate([30,40,30])}catch(e){}setTimeout(()=>box.remove(),3600)}

/* ============ JAŃA JÍL KÓRINISI ============ */
function nyGarland(){const n=13;return `<div class="garland"><svg viewBox="0 0 100 12" preserveAspectRatio="none"><path d="M0 2 Q 8 11 16 4 T 33 4 T 50 4 T 67 4 T 84 4 T 100 2" fill="none" stroke="rgba(255,255,255,.55)" stroke-width=".6"/></svg>${Array.from({length:n},(_,i)=>`<i class="b${i%4}" style="left:${3+i*(94/(n-1))}%;top:${[6,12,8,12,6][i%5]}px;animation-delay:${(i%5)*.35}s"></i>`).join('')}</div><i class="hdrift"></i>`}
function nyCard(){const now=new Date();const y=now.getFullYear();
  if(now.getMonth()===0&&now.getDate()<=10)return `<div class="nyc mt12"><div class="nysn"></div><div style="position:relative"><div class="disp b" style="font-size:1.25rem">🎉 Jańa ${B(y)} jılıńız qutlı bolsın!</div><div class="sm mt8" style="opacity:.75">Jańa jılda jańa maqsetler — búgin baslań</div><button class="nyb mt12" onclick="goalSheet()">🎯 Maqset qoyıw</button></div></div>`;
  const t=new Date(y+1,0,1);const ms=t-now;const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);
  const yp=Math.min(1,(now-new Date(y,0,1))/(t-new Date(y,0,1)));
  return `<div class="nyc mt12"><div class="nysn"></div><div class="row sb" style="position:relative;align-items:flex-end"><div><div class="xs" style="opacity:.7">🎄 Jańa ${B(y+1)}-jılǵa shekem</div>
   <div class="row" style="gap:12px;align-items:flex-end;margin-top:8px"><div><div class="nyd">${B(d)}</div><div class="xs" style="opacity:.6">kún</div></div><div><div class="nyd s">${B(pad(h))}</div><div class="xs" style="opacity:.6">saat</div></div><div><div class="nyd s">${B(pad(m))}</div><div class="xs" style="opacity:.6">minut</div></div></div></div>
   <button class="nyb" onclick="goalSheet({name:'Jańa jıl sawǵaları',emoji:'🎁',target:2000000,deadline:new Date(${y},11,31,12).toISOString()})">🎁 Sawǵaǵa<br>jıynaw</button></div>
   <div class="nybar"><i style="width:${yp*100}%"></i></div><div class="row sb xs" style="opacity:.6;margin-top:6px;position:relative"><span>${B(y)}</span><span>${B(Math.round(yp*100)+'%')} ótti</span><span>${B(y+1)} ✨</span></div></div>`}
/* qar bólegi «+» túymesi */
const FLAKE=(()=>{const arm='<path d="M0 -15V-43M0 -31l-9 -8M0 -31l9 -8"/>';const arms=[0,1,2,3,4,5].map(a=>`<g transform="rotate(${a*60})">${arm}</g>`).join('');
 return `<svg class="flake" viewBox="-48 -48 96 96" aria-hidden="true"><defs><linearGradient id="kfg" gradientUnits="userSpaceOnUse" x1="-45" y1="-45" x2="45" y2="45"><stop offset="0" stop-color="#8CC6FF"/><stop offset=".5" stop-color="#2E86FF"/><stop offset="1" stop-color="#0A57E8"/></linearGradient><radialGradient id="kfc" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#5FAEFF"/><stop offset="1" stop-color="#0A5CF0"/></radialGradient></defs>
 <g stroke="url(#kfg)" stroke-width="6" stroke-linecap="round" fill="none">${arms}</g>
 <circle r="24" fill="url(#kfc)"/><circle r="23.3" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1.3"/><path d="M-15 -9a18 18 0 0 1 19 -11" stroke="rgba(255,255,255,.75)" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>`})();
function flakeTap(b){b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}setTimeout(()=>go('chat'),180)}
/* qar */
let SNOW=null;
function startSnow(){if(SNOW||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=document.createElement('canvas');c.id='snow';document.body.appendChild(c);const x=c.getContext('2d');
  let W,H,dpr=Math.min(2,window.devicePixelRatio||1);const fit=()=>{W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr};fit();addEventListener('resize',fit);
  const F=Array.from({length:16},()=>({x:Math.random(),y:Math.random(),r:.9+Math.random()*1.9,s:.18+Math.random()*.4,w:Math.random()*6.28,a:.25+Math.random()*.45}));
  SNOW={c,run:true};const tick=()=>{if(!SNOW)return;if(!document.hidden){x.clearRect(0,0,W,H);const light=document.documentElement.dataset.theme==='light';
    F.forEach(f=>{f.y+=f.s*.0016;f.w+=.012;f.x+=Math.sin(f.w)*.0006;if(f.y>1.02){f.y=-.02;f.x=Math.random()}x.beginPath();x.arc(f.x*W,f.y*H,f.r*dpr,0,6.283);x.fillStyle=light?`rgba(10,108,255,${f.a*.45})`:`rgba(255,255,255,${f.a})`;x.fill()})}
    requestAnimationFrame(tick)};tick()}
function stopSnow(){if(SNOW){SNOW.c.remove();SNOW=null}}
function toggleNY(){S.ny=!S.ny;save();applyTheme();render();toast(S.ny?'❄️ Jańa jıl kórinisi qosıldı':'Jańa jıl kórinisi óshirildi')}
const _applyTheme=applyTheme;
applyTheme=function(){_applyTheme();document.documentElement.dataset.ny=S.ny?'1':'';S.ny?startSnow():stopSnow()};

/* stil ekranına Jańa jıl toggle */
const _styleScr=SCR.style;
SCR.style=()=>_styleScr().replace('<div class="sec">Rejim</div>',`<div class="sec">Bayram kórinisi</div><div class="card row sb nytog"><div class="row"><span class="ic2" style="background:#1C1C1C;color:#fff">❄️</span><div><div class="b sm">Jańa jıl kórinisi</div><div class="xs muted">Qar, girlyanda hám jańa jılǵa sanaq</div></div></div>${sw(S.ny,'toggleNY()')}</div><div class="sec">Rejim</div>`);

/* AI chat: maqsetler */
const _aiReply=aiReply;
aiReply=function(t){const s=t.toLowerCase();if(/^(maqset|maqsetler|цель|maqsad)/.test(s)){const gs=S.goals||[];return gs.length?'🎯 Maqsetler:\n'+gs.map(g=>{const sv=goalSaved(g);return `${B(g.emoji)} ${esc(g.name)}: ${B(fmt(sv,g.cur))} / ${B(fmt(g.target,g.cur))} ${B(g.cur)} (${B(Math.round(sv/g.target*100)+'%')})`}).join('\n'):'Ele maqset joq. Bas betegi «Maqsetler» bóliminen jańa maqset qosıń 🎯'}return _aiReply(t)};

init();

</script>
